# ./.github/workflows/ci.yml
name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build documentation site
        run: make docs

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run smoke tests
        run: make test-unit

  integration:
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            moodle-image: erseco/alpine-moodle:v4.5.5
            moodle-label: Moodle 4.5.5
            moodle-cache-key: moodle-4-5-5
            run-examples: false
          - python-version: '3.13'
            moodle-image: erseco/alpine-moodle:v5.0.1
            moodle-label: Moodle 5.0.1
            moodle-cache-key: moodle-5-0-1
            run-examples: true
          - python-version: '3.14'
            moodle-image: erseco/alpine-moodle:v5.1.5
            moodle-label: Moodle 5.1.5
            moodle-cache-key: moodle-5-1-5
            run-examples: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Cache Docker images
        uses: actions/cache@v6
        with:
          path: /tmp/docker-cache/${{ matrix.moodle-cache-key }}
          key: ${{ runner.os }}-docker-${{ matrix.moodle-cache-key }}-${{ hashFiles('docker-compose.yml') }}

      - name: Load cached Docker images
        run: |
          if [ -f /tmp/docker-cache/${{ matrix.moodle-cache-key }}/postgres.tar ]; then
            docker load -i /tmp/docker-cache/${{ matrix.moodle-cache-key }}/postgres.tar
          fi
          if [ -f /tmp/docker-cache/${{ matrix.moodle-cache-key }}/moodle.tar ]; then
            docker load -i /tmp/docker-cache/${{ matrix.moodle-cache-key }}/moodle.tar
          fi

      - name: Start ${{ matrix.moodle-label }} with Docker Compose
        run: MOODLE_DOCKER_IMAGE="${{ matrix.moodle-image }}" make upd

      - name: Run tests
        run: |
          set -uo pipefail
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Moodle integration attempt ${attempt}/${max_attempts}"
            log_file="$(mktemp)"

            set +e
            make test-local-ci 2>&1 | tee "$log_file"
            test_status=${PIPESTATUS[0]}
            set -e

            if [ "$test_status" -eq 0 ]; then
              rm -f "$log_file"
              exit 0
            fi

            known_race=0
            if grep -Fq 'duplicate key value violates unique constraint "mdl_cont_conins_uix"' "$log_file"; then
              known_race=1
            fi
            if grep -Fq "Can't find data record in database table course" "$log_file"; then
              known_race=1
            fi

            if [ "$known_race" -ne 1 ]; then
              echo "Integration tests failed for a non-flaky reason; not retrying."
              rm -f "$log_file"
              exit "$test_status"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Known Moodle race persisted after $max_attempts attempts."
              rm -f "$log_file"
              exit "$test_status"
            fi

            echo "Known Moodle database race detected. Resetting Moodle before retry..."
            rm -f "$log_file"
            docker compose down -v
            MOODLE_DOCKER_IMAGE="${{ matrix.moodle-image }}" make upd
          done

      - name: Run example_script.py
        if: matrix.run-examples
        run: python example_script.py

      - name: Save Docker images to cache
        if: always()
        run: |
          mkdir -p /tmp/docker-cache/${{ matrix.moodle-cache-key }}
          docker save postgres:16-alpine -o /tmp/docker-cache/${{ matrix.moodle-cache-key }}/postgres.tar
          docker save "${{ matrix.moodle-image }}" -o /tmp/docker-cache/${{ matrix.moodle-cache-key }}/moodle.tar
